# Runs on every push to main and every pull request. The README says the game runs from
# source on Windows, macOS and Linux with Python 3.10 or newer: this matrix is the proof.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install the locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Rule tests
        run: python tests/test_sim.py
      - name: Server tests (real WebSockets, session logs, the log report)
        run: python tests/test_server.py

  client:
    name: Browser client (boot the server, play a match in headless Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Every client file parses
        run: for f in static/js/*.js tests/browser/*.js; do node --check "$f"; done
      - name: Install the locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Boot the server and check it answers
        run: |
          python server.py --port 8123 --no-browser --fresh > server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:8123/ && break; sleep 1; done
          curl -fsS http://127.0.0.1:8123/ | grep -q "<title>Dodgeball</title>"
          curl -fsS -o /dev/null http://127.0.0.1:8123/static/js/main.js
      - name: Join, start a match and play it in headless Chrome (no page errors allowed)
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          node tests/browser/cdp.js "http://127.0.0.1:8123/?nolock" tests/browser/smoke.json | tee smoke.txt
          grep -q '"s":"play"' smoke.txt
          ! grep -E "EXCEPTION|TIMEOUT|\[console\.error\]" smoke.txt
      - name: Server output (when something failed)
        if: failure()
        run: cat server.log
